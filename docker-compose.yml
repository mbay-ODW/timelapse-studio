# Timelapse Studio – einfacher Start mit Docker Compose
#
#   docker compose up -d --build        →  http://localhost:8080
#
# Bildquellen: jeder Unterordner von SOURCES_PATH wird eine eigene Quelle (read-only eingebunden).
# Hinter einem Reverse-Proxy mit Login siehe deploy/docker-compose.traefik.yml.
x-app: &app
  image: timelapse-studio:latest
  build: .
  restart: unless-stopped
  user: "${PUID:-1000}:${PGID:-1000}"
  environment:
    TZ: ${TZ:-Europe/Berlin}
    HWACCEL: ${HWACCEL:-none}
    MAX_PARALLEL_RENDERS: ${MAX_PARALLEL_RENDERS:-1}
    INDEX_WORKERS: ${INDEX_WORKERS:-8}
    SCAN_INTERVAL_MIN: ${SCAN_INTERVAL_MIN:-60}
    NTFY_URL: ${NTFY_URL:-}
    NTFY_TOPIC: ${NTFY_TOPIC:-}
    NTFY_TOKEN: ${NTFY_TOKEN:-}
  volumes:
    - ${CONFIG_PATH:-./data/config}:/config            # SQLite-Datenbank (klein, sichern!)
    - ${MEDIA_PATH:-./data/media}:/media               # Thumbnails, Uploads, Renders (groß)
    - ${SOURCES_PATH:-./data/sources}:/sources:ro      # Bildquellen, nur lesend
  depends_on:
    init:
      condition: service_completed_successfully

services:
  init:   # legt Verzeichnisse an und setzt Besitzer (läuft einmal als root)
    image: busybox:1.37
    user: "0:0"
    command: >
      sh -c "mkdir -p /config /media && chown -R ${PUID:-1000}:${PGID:-1000} /config
      && chown ${PUID:-1000}:${PGID:-1000} /media"
    volumes:
      - ${CONFIG_PATH:-./data/config}:/config
      - ${MEDIA_PATH:-./data/media}:/media
    restart: "no"

  app:
    <<: *app
    container_name: timelapse-studio
    ports:
      - "${HTTP_PORT:-8080}:8080"

  worker:
    <<: *app
    container_name: timelapse-studio-worker
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    stop_grace_period: 20s
    # Intel/AMD-GPU fürs Encoding (HWACCEL=vaapi): einkommentieren und Gruppen-IDs des Hosts eintragen
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add: ["render", "video"]
